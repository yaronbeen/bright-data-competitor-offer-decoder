[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-offer-decoder"
version = "0.1.0"
description = "Build cited competitor offer scenario worksheets from selected pricing pages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yaron Been"}]
keywords = ["pricing", "competitive-research", "bright-data", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "iniconfig==2.3.0",
  "packaging==26.0",
  "pluggy==1.6.0",
  "Pygments==2.19.2",
]

[project.scripts]
competitor-offer-decoder = "competitor_offer_decoder.cli:main"

[tool.setuptools.packages.find]
include = ["competitor_offer_decoder*"]

[tool.setuptools.data-files]
"share/competitor-offer-decoder/fixtures" = ["fixtures/demo.json", "fixtures/provider-page.md", "fixtures/manifest.synthetic.json"]
"share/competitor-offer-decoder/fixtures/expected" = [
  "fixtures/expected/report.json",
  "fixtures/expected/offers.md",
  "fixtures/expected/offers.csv",
]
"share/competitor-offer-decoder/fixtures/http" = ["fixtures/http/web-unlocker-success.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
